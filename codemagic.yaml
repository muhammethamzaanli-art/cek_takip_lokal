workflows:
  android-apk:
    name: Çek Takip Lokal - Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: ZIP dosyasini aç
        script: |
          unzip -o cek_takip_lokal.zip -d .
      - name: Bağımlılıkları indir
        script: |
          flutter pub get
      - name: Android APK derle (release)
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - muhammethamzaanli@gmail.com
        notify:
          success: true
          failure: true
