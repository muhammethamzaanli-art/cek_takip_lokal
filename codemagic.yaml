workflows:
  android-apk:
    name: Çek Takip Lokal - Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Projeyi Hazırla ve Gradle Güncelle
        script: |
          unzip -o *.zip
          PROJ_DIR=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \;)
          cd "$PROJ_DIR"
          
          # Gradle versiyonunu güncel sürüme yükselt (uyumsuzluğu çözer)
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i '' 's/gradle-.*-all.zip/gradle-7.6.1-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i '' 's/gradle-.*-bin.zip/gradle-7.6.1-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          flutter pub get
          flutter build apk --release
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
    publishing:
      email:
        recipients:
          - muhammethamzaanli@gmail.com
        notify:
          success: true
          failure: true
